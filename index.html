<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Horario Universitario</title>
    
    <!-- Fuentes e Íconos de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <!-- Librería para exportar a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --bg-color: #f0f2f5;
            --surface-color: #ffffff;
            --border-color: #e0e0e0;
            --text-main: #202124;
            --text-muted: #5f6368;
            --hour-height: 65px;
            --sidebar-width: 320px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Panel lateral (Controles) --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
            z-index: 20;
            overflow-y: auto;
        }

        .brand {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand span {
            color: var(--primary-color);
            font-size: 28px;
        }

        .brand h1 {
            font-size: 18px;
            font-weight: 500;
        }

        .form-section {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- STREAMING_CHUNK:Estilizando los inputs y controles... --- */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group label span.material-symbols-outlined {
            font-size: 16px;
        }

        input[type="text"], select, input[type="time"] {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
            background-color: #f8f9fa;
        }

        input[type="text"]:focus, select:focus, input[type="time"]:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.2);
        }

        .time-range {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-range input {
            flex: 1;
        }

        /* Selector de colores mejorado */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        
        .color-option {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .color-option:hover { transform: scale(1.1); }
        .color-option.selected { 
            border-color: var(--text-main); 
            transform: scale(1.1);
        }
        .color-option.selected::after {
            content: 'done';
            font-family: 'Material Symbols Outlined';
            color: white;
            font-size: 16px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .custom-color-wrapper {
            position: relative;
            overflow: hidden;
            background: linear-gradient(45deg, #f44336, #ff9800, #ffeb3b, #4caf50, #2196f3, #9c27b0);
        }
        .custom-color-wrapper input[type="color"] {
            position: absolute;
            top: -10px; left: -10px; width: 100px; height: 100px;
            cursor: pointer; opacity: 0;
        }

        /* Botones */
        .btn {
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-secondary {
            background-color: white;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background-color: #f1f3f4; }

        .btn-danger {
            background-color: #fce8e6;
            color: #d93025;
            margin-top: auto;
            border: 1px solid #fad2cf;
        }
        .btn-danger:hover { background-color: #fad2cf; }

        .actions-bottom {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        /* --- STREAMING_CHUNK:Área principal del calendario... --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-color);
            padding: 20px;
        }

        .calendar-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .calendar-header-toolbar {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calendar-header-toolbar h2 {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-main);
        }

        /* Cabecera de los días */
        .days-header {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--surface-color);
        }

        .time-spacer {
            width: 70px;
            flex-shrink: 0;
            border-right: 1px solid var(--border-color);
        }

        .day-name {
            flex: 1;
            text-align: center;
            padding: 16px 0;
            font-weight: 500;
            color: var(--text-muted);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .day-name:last-child { border-right: none; }
        .day-name .short { font-size: 12px; text-transform: uppercase; }
        .day-name .full { font-size: 16px; color: var(--text-main); }
        .day-name.weekend .full { color: var(--primary-color); }

        /* Cuadrícula desplazable */
        .calendar-scroll {
            flex: 1;
            overflow-y: auto;
            display: flex;
            position: relative;
            background-color: var(--surface-color);
        }

        /* Clase para cuando exportamos a PDF (evita recortes) */
        .pdf-export-mode .calendar-scroll {
            overflow: visible !important;
            height: auto !important;
        }

        .time-column {
            width: 70px;
            flex-shrink: 0;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            position: relative;
        }

        .time-label {
            height: var(--hour-height);
            text-align: right;
            padding-right: 12px;
            color: var(--text-muted);
            font-size: 12px;
            position: relative;
            top: -8px;
        }

        .grid-container {
            flex: 1;
            display: flex;
            position: relative;
            background-image: linear-gradient(to bottom, var(--border-color) 1px, transparent 1px);
            background-size: 100% var(--hour-height);
        }

        .day-col {
            flex: 1;
            border-right: 1px solid var(--border-color);
            position: relative;
        }
        .day-col:last-child { border-right: none; }

        /* --- STREAMING_CHUNK:Tarjetas de curso e interacciones... --- */
        .course-card {
            position: absolute;
            left: 4px;
            right: 4px;
            border-radius: 6px;
            padding: 8px 10px;
            color: white;
            font-size: 12px;
            line-height: 1.4;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
            z-index: 5;
            display: flex;
            flex-direction: column;
        }

        .course-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            z-index: 15;
            filter: brightness(1.05);
        }

        .course-title {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Máximo 2 líneas */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .course-time {
            font-size: 11px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .course-time span.material-symbols-outlined {
            font-size: 12px;
        }

        /* Botón de eliminar (Aparece al hacer hover) */
        .delete-course-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
            backdrop-filter: blur(2px);
        }

        .course-card:hover .delete-course-btn {
            opacity: 1;
        }

        .delete-course-btn:hover {
            background: #d93025;
            color: white;
        }
        
        .delete-course-btn span {
            font-size: 16px;
        }

        @keyframes fadeInScale {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .anim-pop { animation: fadeInScale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <span class="material-symbols-outlined">calendar_month</span>
            <h1>Mi Horario</h1>
        </div>

        <div class="form-section">
            <div class="input-group">
                <label for="course-name">
                    <span class="material-symbols-outlined">book</span> Nombre del curso
                </label>
                <input type="text" id="course-name" placeholder="Ej: Diseño de Software" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="day-select">
                    <span class="material-symbols-outlined">today</span> Día de la semana
                </label>
                <select id="day-select">
                    <option value="lunes">Lunes</option>
                    <option value="martes">Martes</option>
                    <option value="miercoles">Miércoles</option>
                    <option value="jueves">Jueves</option>
                    <option value="viernes">Viernes</option>
                    <option value="sabado">Sábado</option>
                    <option value="domingo">Domingo</option>
                </select>
            </div>

            <div class="input-group">
                <label>
                    <span class="material-symbols-outlined">schedule</span> Horario
                </label>
                <div class="time-range">
                    <input type="time" id="start-time" value="08:00">
                    <span style="color:var(--text-muted)">a</span>
                    <input type="time" id="end-time" value="10:00">
                </div>
            </div>

            <div class="input-group">
                <label>
                    <span class="material-symbols-outlined">palette</span> Color de la tarjeta
                </label>
                <div class="color-grid" id="color-selector">
                    <!-- Presets -->
                    <div class="color-option selected" style="background-color: #0F9D58;" data-color="#0F9D58"></div> <!-- Verde -->
                    <div class="color-option" style="background-color: #4285F4;" data-color="#4285F4"></div> <!-- Azul -->
                    <div class="color-option" style="background-color: #9C27B0;" data-color="#9C27B0"></div> <!-- Morado -->
                    <div class="color-option" style="background-color: #EA4335;" data-color="#EA4335"></div> <!-- Rojo -->
                    <div class="color-option" style="background-color: #F4B400;" data-color="#F4B400"></div> <!-- Amarillo -->
                    <div class="color-option" style="background-color: #00BCD4;" data-color="#00BCD4"></div> <!-- Cyan -->
                    <div class="color-option" style="background-color: #E91E63;" data-color="#E91E63"></div> <!-- Rosa -->
                    <div class="color-option" style="background-color: #FF5722;" data-color="#FF5722"></div> <!-- Naranja Profundo -->
                    <div class="color-option" style="background-color: #607D8B;" data-color="#607D8B"></div> <!-- Azul Grisáceo -->
                    
                    <!-- Color Personalizado (Arcoiris) -->
                    <div class="color-option custom-color-wrapper" title="Elige tu propio color">
                        <input type="color" id="custom-color-input" value="#333333">
                    </div>
                </div>
            </div>

            <button class="btn btn-primary" onclick="addCourse()">
                <span class="material-symbols-outlined">add_circle</span> Añadir Curso
            </button>
        </div>

        <div class="actions-bottom">
            <button class="btn btn-secondary" onclick="exportToPDF()">
                <span class="material-symbols-outlined">picture_as_pdf</span> Exportar a PDF
            </button>
            <button class="btn btn-danger" onclick="clearAll()">
                <span class="material-symbols-outlined">delete_sweep</span> Limpiar Calendario
            </button>
        </div>
    </aside>

    <main class="main-content">
        <div class="calendar-card" id="exportable-area">
            
            <div class="calendar-header-toolbar" data-html2canvas-ignore>
                <h2>Vista Previa del Semestre</h2>
                <!-- Aquí se podrían poner flechas de semanas, pero para el simulador estático lo mantenemos simple -->
            </div>

            <!-- Cabecera de días -->
            <div class="days-header">
                <div class="time-spacer"></div>
                <div class="day-name"><span class="short">Lun</span><span class="full">Lunes</span></div>
                <div class="day-name"><span class="short">Mar</span><span class="full">Martes</span></div>
                <div class="day-name"><span class="short">Mié</span><span class="full">Miércoles</span></div>
                <div class="day-name"><span class="short">Jue</span><span class="full">Jueves</span></div>
                <div class="day-name"><span class="short">Vie</span><span class="full">Viernes</span></div>
                <div class="day-name weekend"><span class="short">Sáb</span><span class="full">Sábado</span></div>
                <div class="day-name weekend"><span class="short">Dom</span><span class="full">Domingo</span></div>
            </div>

            <!-- Área desplazable con la cuadrícula -->
            <div class="calendar-scroll" id="calendar-scroll">
                <!-- Eje Y: Horas -->
                <div class="time-column" id="time-labels"></div>

                <!-- Eje X: Columnas de los días -->
                <div class="grid-container">
                    <div class="day-col" id="lunes"></div>
                    <div class="day-col" id="martes"></div>
                    <div class="day-col" id="miercoles"></div>
                    <div class="day-col" id="jueves"></div>
                    <div class="day-col" id="viernes"></div>
                    <div class="day-col" id="sabado"></div>
                    <div class="day-col" id="domingo"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const START_HOUR = 7; 
        const END_HOUR = 23;  // Hasta las 11 PM
        let selectedColor = '#0F9D58'; 
        let courses = JSON.parse(localStorage.getItem('myCourses')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            renderTimeLabels();
            setupColorSelector();
            renderAllCourses();
        });

        // 1. Dibuja la barra izquierda de horas (7 AM, 8 AM...)
        function renderTimeLabels() {
            const timeCol = document.getElementById('time-labels');
            for (let i = START_HOUR; i <= END_HOUR; i++) {
                const label = document.createElement('div');
                label.className = 'time-label';
                
                const displayHour = i > 12 ? i - 12 : (i === 0 ? 12 : i);
                const amPm = i >= 12 && i < 24 ? 'PM' : 'AM';
                
                // Ocultar texto en la primera hora para alinear estética de cuadrícula
                label.innerText = i === START_HOUR ? '' : `${displayHour} ${amPm}`; 
                timeCol.appendChild(label);
            }
        }

        // 2. Lógica del panel de colores
        function setupColorSelector() {
            const options = document.querySelectorAll('.color-option:not(.custom-color-wrapper)');
            const customInput = document.getElementById('custom-color-input');
            const customWrapper = document.querySelector('.custom-color-wrapper');

            // Clic en colores predefinidos
            options.forEach(option => {
                option.addEventListener('click', (e) => {
                    clearColorSelection();
                    e.currentTarget.classList.add('selected');
                    selectedColor = e.currentTarget.getAttribute('data-color');
                });
            });

            // Uso del selector de color personalizado
            customInput.addEventListener('input', (e) => {
                clearColorSelection();
                customWrapper.classList.add('selected');
                selectedColor = e.target.value;
                customWrapper.style.background = selectedColor; // Quita el arcoíris al seleccionar uno
            });
        }

        function clearColorSelection() {
            document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
        }

        // 3. Conversión de tiempo a posición vertical (Píxeles)
        function timeToPixels(timeString) {
            const [hours, minutes] = timeString.split(':').map(Number);
            const totalMinutes = (hours - START_HOUR) * 60 + minutes;
            // var(--hour-height) es 65px. Entonces 1 minuto = 65/60 px.
            return totalMinutes * (65 / 60); 
        }

        // Formatea la hora de 24h a 12h (Ej: 14:30 -> 2:30 PM)
        function format12Hour(timeString) {
            let [h, m] = timeString.split(':').map(Number);
            const ampm = h >= 12 ? 'pm' : 'am';
            h = h % 12;
            h = h ? h : 12; 
            const mStr = m < 10 ? '0'+m : m;
            return `${h}:${mStr}${ampm}`;
        }

        // 4. Función Principal: Añadir Curso
        function addCourse() {
            const nameInput = document.getElementById('course-name');
            const dayInput = document.getElementById('day-select');
            const startTimeInput = document.getElementById('start-time');
            const endTimeInput = document.getElementById('end-time');

            const name = nameInput.value.trim();
            const day = dayInput.value;
            const startTime = startTimeInput.value;
            const endTime = endTimeInput.value;

            if (!name) {
                alert("Por favor ingresa el nombre del curso.");
                nameInput.focus();
                return;
            }
            if (startTime >= endTime) {
                alert("La hora de fin debe ser posterior a la de inicio.");
                return;
            }
            
            const startPx = timeToPixels(startTime);
            const endPx = timeToPixels(endTime);

            if (startPx < 0) {
                alert(`El horario debe empezar después de las ${START_HOUR}:00 AM`);
                return;
            }

            const newCourse = {
                id: Date.now().toString(),
                name,
                day,
                startTime,
                endTime,
                color: selectedColor,
                top: startPx,
                height: endPx - startPx
            };

            courses.push(newCourse);
            saveCourses();
            renderCourseOnScreen(newCourse, true);
            
            nameInput.value = '';
            nameInput.focus();
        }

        // 5. Renderizar Curso en el DOM
        function renderCourseOnScreen(course, animate = false) {
            const col = document.getElementById(course.day);
            if (!col) return;

            const card = document.createElement('div');
            card.className = 'course-card';
            if (animate) card.classList.add('anim-pop');
            
            card.style.backgroundColor = course.color;
            card.style.top = `${course.top}px`;
            card.style.height = `${course.height}px`;
            card.id = `course-${course.id}`;

            const timeStr = `${format12Hour(course.startTime)} - ${format12Hour(course.endTime)}`;

            card.innerHTML = `
                <div class="course-title" title="${course.name}">${course.name}</div>
                <div class="course-time">
                    <span class="material-symbols-outlined">schedule</span>
                    ${timeStr}
                </div>
                <div class="delete-course-btn" title="Eliminar clase" onclick="removeCourse('${course.id}')" data-html2canvas-ignore>
                    <span class="material-symbols-outlined">delete</span>
                </div>
            `;

            col.appendChild(card);
        }

        // 6. Funciones de Gestión y Persistencia
        function renderAllCourses() {
            document.querySelectorAll('.day-col').forEach(col => col.innerHTML = '');
            courses.forEach(course => renderCourseOnScreen(course));
        }

        function removeCourse(id) {
            if (confirm("¿Eliminar este bloque de curso?")) {
                courses = courses.filter(c => c.id !== id);
                saveCourses();
                const el = document.getElementById(`course-${id}`);
                if (el) {
                    el.style.transform = 'scale(0.9)';
                    el.style.opacity = '0';
                    setTimeout(() => el.remove(), 200);
                }
            }
        }

        function clearAll() {
            if (courses.length === 0) return;
            if (confirm("¿Estás seguro de que quieres borrar todo tu horario? Esta acción no se puede deshacer.")) {
                courses = [];
                saveCourses();
                renderAllCourses();
            }
        }

        function saveCourses() {
            localStorage.setItem('myCourses', JSON.stringify(courses));
        }

        // --- STREAMING_CHUNK:Lógica para Exportar a PDF... ---
        function exportToPDF() {
            if(courses.length === 0) {
                alert("Agrega al menos un curso antes de exportar.");
                return;
            }

            // Preparar el elemento para exportación
            const element = document.getElementById('exportable-area');
            const container = document.querySelector('.calendar-card');
            
            // Añadir clase para expandir todo el contenido oculto por el scroll
            container.classList.add('pdf-export-mode');

            // Configuración de html2pdf
            const opt = {
                margin:       10,
                filename:     'Mi_Horario_Universitario.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            // Generar y descargar
            html2pdf().set(opt).from(element).save().then(() => {
                // Restaurar el diseño original quitando la clase
                container.classList.remove('pdf-export-mode');
            });
        }
    </script>
</body>
</html>
